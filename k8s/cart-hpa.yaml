apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-service-hpa
  namespace: nodejs-devops

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart-service-blue

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
