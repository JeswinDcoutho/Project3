apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service-green
  namespace: ecommerce
  labels:
    app: cart-service
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
      version: green
  template:
    metadata:
      labels:
        app: cart-service
        version: green
    spec:
      containers:
        - name: cart-service
          image: ecommerce-cart-service:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: REDIS_PORT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
