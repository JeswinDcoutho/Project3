apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: nodejs-devops
  labels:
    app: user-service
    track: rolling
    monitoring: user-service
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: user-service
      track: rolling
      monitoring: user-service

  template:
    metadata:
      labels:
        app: user-service
        track: rolling
        monitoring: user-service

    spec:
      containers:
        - name: user-service
          image: 777000838263.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-user-service:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001

          env:
            - name: POSTGRES_DB
              value: ecommerce

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_PORT

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
