apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-green
  namespace: ecommerce
  labels:
    app: user-service
    version: green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service
      version: green

  template:
    metadata:
      labels:
        app: user-service
        version: green

    spec:
      containers:
        - name: user-service
          image: ecommerce-user-service:5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001

          env:
            - name: POSTGRES_DB
              value: user_db

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_PORT

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
