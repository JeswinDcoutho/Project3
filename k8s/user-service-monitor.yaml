apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service-monitor
  namespace: nodejs-devops
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      monitoring: user-service
  namespaceSelector:
    matchNames:
      - nodejs-devops
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
